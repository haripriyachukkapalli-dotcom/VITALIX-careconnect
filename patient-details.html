<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Details - VITALIX</title><link rel="stylesheet" href="style.css"></head>
<body><main class="page"><header class="topbar"><div class="brand">VITALIX</div><span>CareConnect</span></header>
<section class="card form-card"><h1>Patient Details</h1><p class="muted">Demo information for the prototype.</p>
<label>Name</label><input id="name" placeholder="Enter patient name">
<label>Age</label><input id="age" type="number" min="1" max="120" placeholder="Age">
<label>Gender</label><select id="gender"><option>Select</option><option>Female</option><option>Male</option><option>Other</option></select>
<label>City / Area</label><input id="city" placeholder="City or area">
<label>Health concern</label><textarea id="concern" placeholder="Example: fever, check-up, follow-up"></textarea>
<button onclick="savePatient()">Save & Open Dashboard</button>
</section></main><script src="script.js"></script></body></html>
